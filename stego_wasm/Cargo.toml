[package]
name = "stego_wasm"
version = "0.1.0"
edition = "2021"

# 1. This tells Rust to make a "dynamic system library" (WASM)
[lib]
crate-type = ["cdylib"]

[dependencies]
# The bridge between Rust and JavaScript
wasm-bindgen = "0.2"
flate2 = "1.0"

# Your existing cryptography tools
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_chacha = "0.3"

# IMAGE HANDLING
# We need to disable default features (like multi-threading) because
# WASM is single-threaded by default.
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
base64 = "0.21"

# CRITICAL FOR WEB:
# The standard random number generator doesn't work in browsers.
# We must enable the "js" feature so it can ask the browser for entropy.
getrandom = { version = "0.2", features = ["js"] }

sha2 = "0.10"